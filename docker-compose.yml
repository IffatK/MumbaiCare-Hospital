# MumbaiCare — MERN + Supabase (PostgreSQL)
# Run:  cp .env.example .env  →  fill DATABASE_URL + JWT_SECRET  →  docker compose up --build
services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["4000:4000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
